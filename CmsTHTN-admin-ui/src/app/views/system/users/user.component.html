<div class="animated fadeIn">
  <p-panel #pnl [style]="{ 'margin-bottom': '10px' }">
    <p-header> Quản lý người dùng </p-header>
    <div class="row" style="display: flex; margin-left: 50px;">
      <div class="col" style="display: flex;">
        <button *ngIf="hasPermission('Permissions.Users.Create')" style="width: 100px; display: flex; justify-content: center;" 
        pButton type="button" icon="fa fa-plus" (click)="showAddModal()" class="p-button-sm p-button-info ms-1"><b>Thêm</b></button>
        <button *ngIf="selectedItems.length > 0 && hasPermission('Permissions.Users.Delete')" style="width: 100px; display: flex; justify-content: center;"
          pButton type="button" icon="fa fa-trash" (click)="deleteItems()" class="p-button-sm p-button-danger ms-1"><b>Xóa</b></button>
        <button *ngIf="selectedItems.length == 1 && hasPermission('Permissions.Users.Edit')" style="width: 100px; display: flex; justify-content: center;" 
        pButton type="button" icon="fa fa-edit" (click)="showEditModal()" class="p-button-sm p-button-warning ms-1"><b>Sửa</b></button>
      </div>
      <div class="col">
        <div class="row" style="float: right; margin-right: 100px;">
          <div class="col">
            <input id="txtKeyword" pInputText (keyup.enter)="loadData()" [(ngModel)]="keyword"
              placeholder="Nhập từ khóa..." type="text" />
          </div>
          <div class="col">
            <button style="width: 100px; display: flex; justify-content: center;" type="button" pButton (click)="loadData()">Tìm</button>
          </div>
        </div>
      </div>
    </div>
    <div class="row mt-3">
      <p-table #dt [value]="items" selectionMode="multiple" dataKey="id" [(selection)]="selectedItems"
        [metaKeySelection]="true">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 10px">
              <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
            </th>
            <th>Tên</th>
            <th>Tài khoản</th>
            <th>Email</th>
            <th style="text-align: center;">Số ĐT</th>
            <th style="text-align: center;">Ngày tham gia</th>
            <th style="text-align: center;">Số dư</th>
            <th style="text-align: center;">Trạng thái</th>
            <th></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr [pSelectableRow]="row">
            <td style="width: 10px">
              <span class="ui-column-title"></span>
              <p-tableCheckbox [value]="row"></p-tableCheckbox>
            </td>
            <td>{{ row.firstName }}</td>
            <td>{{ row.userName }}</td>
            <td>{{ row.email }}</td>
            <td style="text-align: center;">{{ row.phoneNumber }}</td>
            <td style="text-align: center;">{{ row.dateCreated | date: 'dd-MM-yyyy hh:mm' }}</td>
            <td style="text-align: center;">{{ row.balance | number}}</td>
            <td style="text-align: center;">
              <p-badge *ngIf="row.isActive == 1" value="Kích hoạt" severity="success"></p-badge>
              <p-badge *ngIf="row.isActive == 0" value="Khoá" severity="danger"></p-badge>
            </td>
            <td>
              <button *ngIf="hasPermission('Permissions.Users.ChangePassword')" pButton pRipple type="button" icon="pi pi-key" pTooltip="Đặt mật khẩu" tooltipPosition="top"
                class="p-button-rounded p-button-text" (click)="setPassword(row.id)"></button>
              <button *ngIf="hasPermission('Permissions.Users.ChangeEmail')" pButton pRipple type="button" icon="pi pi-envelope" pTooltip="Đặt Email" tooltipPosition="top"
                (click)="changeEmail(row.id)" class="p-button-rounded p-button-text"></button>
              <button *ngIf="hasPermission('Permissions.Users.ChangePermission')" pButton pRipple type="button" icon="pi pi-users" pTooltip="Gán vai trò" tooltipPosition="top"
                (click)="assignRole(row.id)" class="p-button-rounded p-button-text"></button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="summary">
          <div style="text-align: left">Tổng số: {{ totalCount | number }}</div>
        </ng-template>
      </p-table>
    </div>

    <p-paginator [rows]="pageSize" [totalRecords]="totalCount" (onPageChange)="pageChanged($event)"
      [rowsPerPageOptions]="[10, 20, 50, 100]"></p-paginator>

    <p-blockUI [target]="pnl" [blocked]="blockedPanel">
      <p-progressSpinner [style]="{ width: '100px', height: '100px', position: 'absolute', top: '25%', left: '50%' }"
        strokeWidth="2" animationDuration=".5s"></p-progressSpinner>
    </p-blockUI>
  </p-panel>
</div>
